[package]
name = "tuff-relay"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"

[lib]
name = "tuff_relay"
path = "src/lib.rs"

[[bin]]
name = "tuff-relay"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true


